[project]
name = "logtriage"
version = "0.1.0"
description = "ML anomaly detection on AIT-LDS security logs and an agent that writes evidence-cited, ATT&CK-mapped incident reports."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "drain3>=0.9.11",
    "duckdb>=2.0.0",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
    "xgboost>=3.2.0",
]

[project.scripts]
logtriage = "logtriage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logtriage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff also formats code blocks in Markdown; plan.md and the other docs stay as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: calls the real LLM API",
    "data: needs data/ (downloaded or processed datasets) or downloaded models",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
