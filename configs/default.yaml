# Default LogTriage configuration, loaded by logtriage.config.
# Environment overrides use the LOGTRIAGE_ prefix, with __ between nested keys,
# e.g. LOGTRIAGE_SEED=7 or LOGTRIAGE_PATHS__DATA_DIR=/mnt/data.
# Secrets never go here: DEEPSEEK_API_KEY comes only from the environment or .env.

seed: 42

# Test testbeds, none of them tuned on. santos keeps the frozen targets of reports/targets.md;
# every guard treats all of them alike (plan 4.3, D56). shaw is the unseen testbed of M12 (D74,
# D83); the M11 evaluation keeps its own three (config.M11_TESTBEDS).
test_testbeds: [santos, wardbeck, harrison, shaw]

# LLM policy (plan 7.1). Model, prices and parameters verified on 2026-11-06 (status.md).
llm:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  temperature: 0
  # Thinking mode ignores temperature, and it is the API default, so it is set explicitly (D44).
  thinking: disabled
  max_tokens: 8192
  timeout_seconds: 120
  http_retries: 2
  # Retries after an answer that fails validation (plan 7.1).
  json_retries: 2
  max_usd_per_run: 5
  # Cumulative spend over all runs, from the ledger in the cache file (D45).
  max_usd_total: 10
  pricing_usd_per_1m:
    off_peak: {input: 0.15, cached_input: 0.003, output: 0.6}
    peak: {input: 0.3, cached_input: 0.006, output: 1.2}
  # Monday to Friday, UTC, start and end hour (D45).
  peak_hours_utc: [[1, 4], [6, 10]]

# Agent graph (plan 7.2, 7.4).
agents:
  max_tool_calls: 8
  max_evidence: 30
  # Characters of one evidence line kept in a report (plan 5.7).
  evidence_chars: 500
  max_rewrites: 2
  # Techniques retrieved for the Mapper, and the most it may pick.
  mapper_k: 10
  max_techniques: 3
  candidate_chars: 400
  # Most window scores listed in the Investigator's first message.
  context_windows: 40
  # Ablation switches (plan 10.4). M8 runs only this default condition.
  verifier: true
  rag: true
  few_shot: false
  # Set once prompts are final on the dev testbed; the test testbed needs it (M8).
  prompts_frozen: true

# Dashboard and replay (plan 9.1).
app:
  # Local only by default: the dashboard shows logs and spends API money.
  host: 127.0.0.1
  port: 8501
  # Replay speed factors, simulated seconds per wall second.
  speeds: [60, 600, 3600]
  default_speed: 600
  tick_seconds: 2
  # The replay starts this long before the earliest incident.
  replay_lead_minutes: 60
  # Windows shown on each side of an incident in its timeline.
  timeline_context_minutes: 60

# Anomaly detection (plan 6.3-6.6).
ml:
  # A (testbed, log_type) with fewer parsed fit-period lines loses its vocabulary features (plan 6.3).
  min_fit_lines: 200
  # With min_fit_lines, the parsed lines a log type needs to be baseline-capable (plan 6.4).
  min_calib_lines: 50
  # Fixed in M3 (reports/targets.md); the threshold q is chosen under it (plan 6.5).
  incidents_per_day_budget: 25
  # Models (plan 6.4).
  if_estimators: 300
  lof_neighbors: 35
  # LOF fits on a sample of at most this many windows.
  lof_max_windows: 50000
  pca_variance: 0.95
  # A stream or log type with fewer calib windows borrows a wider reference (plan 6.5, D28).
  min_calib_windows: 200
  oof_folds: 5
  # Chosen on russellmitchell by logtriage.eval.tuning and reused unchanged on santos.
  q: 0.999
  gap_minutes: 30
  q_grid: [0.95, 0.97, 0.98, 0.99, 0.995, 0.999]
  gap_grid: [5, 10, 15, 30]
  # An entity in more than this share of the fit windows of its log type does not link (plan 6.6).
  common_entity_share: 0.5
  # Supervised reference, fixed and never searched (plan 6.7, D34, D36, D37).
  supervised:
    rf_trees: 300
    rf_class_weight: balanced_subsample
    xgb_trees: 300
    xgb_max_depth: 4
    xgb_learning_rate: 0.1
    cv_blocks: 5
    purge_minutes: 30
    # A log type with fewer dev positives is reported n/a, with no fallback.
    min_positives: 5
    training_periods: [calib, eval]
    # Secondary variant, used for no selection.
    all_periods: [fit, calib, eval]

# Limits of the agent tools (plan 7.2, 7.3).
tools:
  # Most characters of one tool output, and of one log line inside it.
  output_chars: 4000
  line_chars: 300
  sql_rows: 200
  sql_timeout_seconds: 10
  log_search_limit: 50
  # Templates listed per log type and host by ip_profile.
  top_templates: 3
  attack_k: 5
  incidents_k: 3

# ATT&CK index and incident memory (plan 8).
rag:
  embedding_model: BAAI/bge-small-en-v1.5
  # The revision the index was built with. The Dockerfile bakes the same one (D52).
  embedding_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  # The pinned bundle; `index-attack` refuses any other file.
  attack_version: "20.1"
  attack_sha256: 539a843a7b53ed9749740b2123dddae3726b1a4831841c32aca740b011b910b5
  attack_collection: attack
  incidents_collection: incidents
  # Hybrid search of the ATT&CK index: textbook values, fixed before measuring (D43).
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60

# Windows and features (plan 5.4, 6.3).
features:
  # D1 fixes one-minute windows.
  window_seconds: 60
  # Length of the `src_ips` and `users` lists of a window.
  top_entities: 10
  # Second-level names that are public suffixes under a two-letter TLD, as in co.uk or com.cn.
  second_level_suffixes: [ac, co, com, edu, go, gov, ne, net, or, org]
  # Negative scaled values of these features are clipped at 0 (D29).
  one_sided_features:
    - mean_qname_len
    - max_label_len
    - mean_label_entropy
    - max_label_entropy
    - ratio_unique_qnames
    - top_domain_share

# Training and evaluation boundaries (plan 4.3). The computed values go to periods.json.
periods:
  # Training ends this long before the first attack.
  gap_hours: 24
  # Training must last this long, otherwise fallback_gap_hours replaces gap_hours.
  min_training_hours: 24
  fallback_gap_hours: 6
  # Share of the training period used to fit; the rest is calibration.
  fit_fraction: 0.8

# Drain3 templating (plan 6.2). File paths are deliberately not masked.
drain:
  sim_th: 0.4
  depth: 4
  max_children: 100
  # Applied in order, so the more specific patterns come first.
  masking:
    - mask_with: UUID
      pattern: '(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
    - mask_with: IP
      pattern: '(?<![\w.])\d{1,3}(?:\.\d{1,3}){3}(?![\w.])'
    - mask_with: IP6
      pattern: '(?i)(?<![\w:.])(?=(?:[0-9a-f]{0,4}:){2})[0-9a-f:]{3,39}(?![\w:.])'
    - mask_with: HEX
      pattern: '(?i)\b(?:0x[0-9a-f]+|[0-9a-f]{8,})\b'
    - mask_with: B64
      pattern: '(?<![\w/+=*-])[A-Za-z0-9+=*_-]{20,}'
    - mask_with: NUM
      pattern: '(?<![A-Za-z0-9])\d+(?![A-Za-z0-9])'

# Attack phases (plan 5.3). Used only to build data_meta/phases_<testbed>.csv.
phases:
  intervals_file: labels.csv
  tolerance_seconds: 60
  # Attacker-side record of the DNS exfiltration, the source of the exfil phase.
  exfil_log: gather/attacker_0/logs/dnsteal.log
  exfil_phase: dnsteal_exfil
  # Only lines with this raw label can take the exfil phase.
  exfil_label: dnsteal
  # Phase name to the attack steps to compare its start with, for the cross-check.
  # Steps come from attacks.log, except exfil_last_received, which comes from exfil_log.
  steps:
    network_scans: [vpn_connect]
    service_scans: [service_scan]
    dirb: [dirb_scan]
    wpscan: [wpscan]
    webshell: [upload_rce_shell]
    cracking: [crack_wphash]
    reverse_shell: [reverse_shell_listen]
    privilege_escalation: [open_pty]
    service_stop: [exfil_last_received, dnsteal_stop]

# Dataset sources (plan 4.1, 4.2). File names, URLs and checksums come from the Zenodo API.
download:
  api_url: https://zenodo.org/api/records
  sources:
    russellmitchell:
      record: 5789064
      files: [russellmitchell.zip]
    santos:
      record: 5789064
      files: [santos.zip]
    wardbeck:
      record: 5789064
      files: [wardbeck.zip]
    harrison:
      record: 5789064
      files: [harrison.zip]
    shaw:
      record: 5789064
      files: [shaw.zip]
    ait_ads:
      record: 8263181
      files: [ait_ads.zip, labels.csv]
      # Only the alerts of the testbeds in use; the zip holds all eight scenarios.
      extract: [russellmitchell_*.json, santos_*.json, wardbeck_*.json, harrison_*.json, shaw_*.json]
  max_retries: 3
  backoff_seconds: 10
  timeout_seconds: 60
  chunk_bytes: 8388608
  # Free space required before a download, as a multiple of the archive size.
  min_free_factor: 5.0

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/index
  cache_dir: data/cache
  data_meta_dir: data_meta
  reports_dir: reports
  sources_file: configs/sources.yaml
  gold_mapping_file: configs/gold_attack_mapping.yaml
  attack_stix_file: data/raw/attack/enterprise-attack.json
